<!-- @dsCard group="Directions" name="Bold modern" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#0b0b0d;--fg:#f5f5f4;--muted:#a3a3a3;--surface:#17171a;--line:#2a2a2f;--accent:#e8ff47;--accent-fg:#0b0b0d;--radius:4px;--measure:60ch;--section-y:clamp(3rem, 8vw, 6rem);--font-heading:'Archivo',serif;--font-body:'Inter',sans-serif}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5}
.wrap{padding:48px;max-width:960px;margin:0 auto} h1,h2{font-family:var(--font-heading);letter-spacing:-.01em;margin:0 0 12px} h1{font-size:52px;line-height:1.05} h2{font-size:28px}
p{color:var(--muted);max-width:var(--measure)} .btn{display:inline-block;background:var(--accent);color:var(--accent-fg);padding:12px 20px;border-radius:var(--radius);font-weight:600;text-decoration:none;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px} .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px} .card h3{font-family:var(--font-heading);margin:0 0 6px}
.sw{display:flex;gap:8px;margin-top:40px} .sw div{width:44px;height:44px;border-radius:var(--radius);border:1px solid var(--line)}</style></head>
<body><div class="wrap"><p style="text-transform:uppercase;letter-spacing:.08em;font-size:12px">Bold modern</p>
<h1>A place to belong on Sunday morning</h1><p>Heavy display type, a saturated accent, tight rhythm. Feels energetic and current.</p><a class="btn" href="#">Plan a visit</a>
<div class="grid"><div class="card"><h3>Worship</h3><p>Sundays at 10am, everyone welcome.</p></div><div class="card"><h3>Community</h3><p>Wednesday soup lunch, no sign-up needed.</p></div><div class="card"><h3>Serve</h3><p>Food pantry every second Saturday.</p></div></div>
<div class="sw"><div style="background:var(--bg)"></div><div style="background:var(--surface)"></div><div style="background:var(--accent)"></div><div style="background:var(--fg)"></div></div></div></body></html>
